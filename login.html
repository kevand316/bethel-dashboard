<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bethel Residency — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root {
  --bg: #0a0e14;
  --bg2: #111620;
  --bg3: #1a2030;
  --border: #1e2d45;
  --gold: #f0b429;
  --gold-dim: #a07820;
  --green: #2ecc71;
  --red: #e74c3c;
  --text: #e8edf5;
  --text-mid: #e8edf5;
  --text-dim: #e8edf5;
  --mono: 'IBM Plex Mono', monospace;
  --sans: 'IBM Plex Sans', sans-serif;
  --display: 'Bebas Neue', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
}

.card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 40px 32px;
  width: 100%;
  max-width: 400px;
}

.logo {
  font-family: var(--display);
  font-size: 28px;
  letter-spacing: 0.08em;
  color: var(--gold);
  text-align: center;
  margin-bottom: 4px;
}

.tagline {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-dim);
  text-align: center;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-bottom: 36px;
}

h1 {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-mid);
  margin-bottom: 24px;
  text-align: center;
}

.field {
  margin-bottom: 16px;
}

label {
  display: block;
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-mid);
  margin-bottom: 6px;
}

input {
  width: 100%;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text);
  font-family: var(--mono);
  font-size: 14px;
  min-height: 44px; /* Apple HIG / WCAG 2.5.8 minimum tap target */
  padding: 10px 12px;
  outline: none;
  transition: border-color 0.15s;
  -webkit-appearance: none;
}

input:focus {
  border-color: var(--gold-dim);
}

input::placeholder {
  color: var(--text-dim);
}

button[type="submit"] {
  width: 100%;
  background: var(--gold);
  border: none;
  border-radius: 4px;
  color: #0a0e14;
  cursor: pointer;
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.1em;
  margin-top: 8px;
  min-height: 44px; /* Apple HIG / WCAG 2.5.8 minimum tap target */
  padding: 12px;
  text-transform: uppercase;
  transition: background 0.15s, opacity 0.15s;
}

button[type="submit"]:hover:not(:disabled) {
  background: #d9a020;
}

button[type="submit"]:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.error-msg {
  background: rgba(231, 76, 60, 0.12);
  border: 1px solid rgba(231, 76, 60, 0.35);
  border-radius: 4px;
  color: var(--red);
  font-family: var(--mono);
  font-size: 12px;
  margin-top: 16px;
  padding: 10px 12px;
  display: none;
}

.error-msg.visible { display: block; }

.forgot-link {
  display: block;
  text-align: right;
  margin-top: 8px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-dim);
  text-decoration: none;
  transition: color 0.15s;
}

.forgot-link:hover { color: var(--text-mid); }

/* ── Mode toggle (Sign in ↔ Sign up) ─────────────────────────────────── */
.mode-toggle {
  text-align: center;
  margin-top: 20px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-dim);
}

.toggle-link {
  background: none;
  border: none;
  color: var(--text-mid);
  cursor: pointer;
  font-family: var(--mono);
  font-size: 11px;
  padding: 0;
  text-decoration: underline;
  text-underline-offset: 2px;
  transition: color 0.15s;
}

.toggle-link:hover { color: var(--text); }

/* ── Back link (used in reset + signup views) ────────────────────────── */
.back-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-dim);
  text-decoration: none;
  margin-bottom: 20px;
  cursor: pointer;
  background: none;
  border: none;
  padding: 0;
  transition: color 0.15s;
}

.back-link:hover { color: var(--text-mid); }

.success-msg {
  background: rgba(46, 204, 113, 0.1);
  border: 1px solid rgba(46, 204, 113, 0.3);
  border-radius: 4px;
  color: var(--green);
  font-family: var(--mono);
  font-size: 12px;
  padding: 10px 12px;
  display: none;
}

.success-msg.visible { display: block; }

/* Neither a success nor an error: the account exists, which is ordinary, but it
   means no email went out and the operator has to do something different. */
.notice-msg {
  display: none;
  margin-top: 14px;
  padding: 12px 14px;
  border: 1px solid var(--gold-dim);
  border-left: 3px solid var(--gold);
  background: rgba(240, 180, 41, 0.07);
  color: var(--text);
  font-family: var(--mono);
  font-size: 12px;
  line-height: 1.6;
}
.notice-msg.visible { display: block; }
.notice-msg .toggle-link { margin-top: 6px; display: inline-block; }

.footer {
  margin-top: 24px;
  text-align: center;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-dim);
}

.footer a {
  color: var(--text-dim);
  text-decoration: none;
  transition: color 0.15s;
}

.footer a:hover { color: var(--text-mid); }

/* ── View visibility ─────────────────────────────────────────────────── */
#login-view  { display: block; }
#signup-view { display: none; }
#reset-view  { display: none; }
</style>
</head>
<body>

<div class="card">
  <div class="logo">Bethel Residency</div>
  <div class="tagline">Operations Dashboard</div>

  <!-- ── Sign-in view ───────────────────────────────────────────── -->
  <div id="login-view">
    <h1>Sign In</h1>
    <form id="login-form" autocomplete="on">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" name="email" placeholder="you@example.com" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button type="submit" id="login-btn">Sign In</button>
      <a class="forgot-link" id="forgot-link" href="#">Forgot password?</a>
      <div class="error-msg" id="login-error"></div>
    </form>
    <div class="mode-toggle">
      New here? <button class="toggle-link" id="to-signup">Create an account</button>
    </div>
  </div>

  <!-- ── Sign-up view ───────────────────────────────────────────── -->
  <div id="signup-view">
    <button class="back-link" id="signup-back-btn">&#8592; Back to sign in</button>
    <h1>Create Account</h1>
    <form id="signup-form" autocomplete="off">
      <div class="field">
        <label for="su-email">Email</label>
        <input id="su-email" type="email" name="email" placeholder="you@example.com" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="su-password">Password</label>
        <input id="su-password" type="password" name="new-password" placeholder="At least 8 characters" autocomplete="new-password" required minlength="8">
      </div>
      <div class="field">
        <label for="su-confirm">Confirm Password</label>
        <input id="su-confirm" type="password" name="confirm-password" placeholder="Repeat password" autocomplete="new-password" required minlength="8">
      </div>
      <button type="submit" id="signup-btn">Create Account</button>
      <div class="error-msg" id="signup-error"></div>
      <div class="success-msg" id="signup-success">Check your email to confirm your account.</div>
      <!-- Shown when Supabase reports the address already has an account. It
           answers with a fake success in that case and sends nothing, so this
           has to be a separate message or the page lies to the operator. -->
      <div class="notice-msg" id="signup-exists">
        <span id="signup-exists-text">An account already exists for this email.</span>
        <button type="button" class="toggle-link" id="resend-confirm-btn">Resend the confirmation email</button>
      </div>
    </form>
    <div class="mode-toggle">
      Already have an account? <button class="toggle-link" id="to-login">Sign in</button>
    </div>
  </div>

  <!-- ── Reset-password view ────────────────────────────────────── -->
  <div id="reset-view">
    <button class="back-link" id="back-btn">&#8592; Back to sign in</button>
    <h1>Reset Password</h1>
    <form id="reset-form">
      <div class="field">
        <label for="reset-email">Email</label>
        <input id="reset-email" type="email" name="email" placeholder="you@example.com" autocomplete="email" required>
      </div>
      <button type="submit" id="reset-btn">Send Reset Link</button>
      <div class="error-msg" id="reset-error"></div>
      <div class="success-msg" id="reset-success">Check your inbox — a reset link is on its way.</div>
    </form>
  </div>
</div>

<div class="footer">
  Need help? <a href="mailto:info@bethelresidency.com">Contact support</a>
</div>

<script>
(function () {
  const SUPABASE_URL = 'https://yqgccykbdihsjqlapghr.supabase.co';
  const SUPABASE_ANON_KEY =
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.' +
    'eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlxZ2NjeWtiZGloc2pxbGFwZ2hyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIzNDAyMTksImV4cCI6MjA4NzkxNjIxOX0.' +
    'XHgok8xbYDKekprYI2htAZL622P7YcycTsQ5HuP-VUs';

  const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // If already signed in, go straight to the dashboard.
  client.auth.getSession().then(({ data: { session } }) => {
    if (session) window.location.href = '/';
  });

  // ── View switching ─────────────────────────────────────────────────────────
  function showView(id) {
    ['login-view', 'signup-view', 'reset-view'].forEach((v) => {
      document.getElementById(v).style.display = v === id ? 'block' : 'none';
    });
  }

  document.getElementById('to-signup').addEventListener('click', () => {
    clearSignupForm();
    showView('signup-view');
  });

  document.getElementById('to-login').addEventListener('click', () => {
    showView('login-view');
  });

  document.getElementById('forgot-link').addEventListener('click', (e) => {
    e.preventDefault();
    const loginEmail = document.getElementById('email').value.trim();
    if (loginEmail) document.getElementById('reset-email').value = loginEmail;
    showView('reset-view');
  });

  document.getElementById('back-btn').addEventListener('click', () => {
    document.getElementById('reset-error').classList.remove('visible');
    document.getElementById('reset-success').classList.remove('visible');
    document.getElementById('reset-btn').disabled = false;
    document.getElementById('reset-btn').textContent = 'Send Reset Link';
    showView('login-view');
  });

  document.getElementById('signup-back-btn').addEventListener('click', () => {
    showView('login-view');
  });

  function clearSignupForm() {
    document.getElementById('su-email').value = '';
    document.getElementById('su-password').value = '';
    document.getElementById('su-confirm').value = '';
    document.getElementById('signup-error').classList.remove('visible');
    document.getElementById('signup-success').classList.remove('visible');
    document.getElementById('signup-btn').disabled = false;
    document.getElementById('signup-btn').textContent = 'Create Account';
  }

  // ── Sign-in form ───────────────────────────────────────────────────────────
  const loginForm = document.getElementById('login-form');
  const loginBtn  = document.getElementById('login-btn');
  const loginErr  = document.getElementById('login-error');

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    loginBtn.disabled = true;
    loginBtn.textContent = 'Signing in…';
    loginErr.classList.remove('visible');

    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    const { error } = await client.auth.signInWithPassword({ email, password });

    if (error) {
      loginErr.textContent = error.message;
      loginErr.classList.add('visible');
      loginBtn.disabled = false;
      loginBtn.textContent = 'Sign In';
      return;
    }

    window.location.href = '/';
  });

  // ── Sign-up form ───────────────────────────────────────────────────────────
  const signupForm = document.getElementById('signup-form');
  const signupBtn  = document.getElementById('signup-btn');
  const signupErr  = document.getElementById('signup-error');
  const signupOk   = document.getElementById('signup-success');
  const signupExists = document.getElementById('signup-exists');
  const existsText   = document.getElementById('signup-exists-text');
  const resendBtn    = document.getElementById('resend-confirm-btn');

  // One definition of where a confirmation link lands. This host also has to be
  // in the Supabase Auth redirect allowlist, or the link in the email dead-ends.
  const SIGNUP_REDIRECT = 'https://dashboard.bethelresidency.com/';

  // Remembered so "resend" knows which address to resend to.
  let lastSignupEmail = '';

  signupForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    signupErr.classList.remove('visible');
    // A second attempt must not sit under the previous attempt's verdict.
    signupExists.classList.remove('visible');
    signupOk.classList.remove('visible');
    resendBtn.style.display = '';
    resendBtn.disabled = false;
    resendBtn.textContent = 'Resend the confirmation email';
    existsText.textContent = 'An account already exists for this email. If you never received the confirmation email, resend it below. Otherwise sign in, or use "Forgot password".';

    const email   = document.getElementById('su-email').value.trim();
    const pw      = document.getElementById('su-password').value;
    const confirm = document.getElementById('su-confirm').value;

    // Client-side validation
    if (pw.length < 8) {
      signupErr.textContent = 'Password must be at least 8 characters.';
      signupErr.classList.add('visible');
      return;
    }
    if (pw !== confirm) {
      signupErr.textContent = 'Passwords do not match.';
      signupErr.classList.add('visible');
      return;
    }

    signupBtn.disabled = true;
    signupBtn.textContent = 'Creating account…';

    const { data, error } = await client.auth.signUp({
      email,
      password: pw,
      options: {
        emailRedirectTo: SIGNUP_REDIRECT,
      },
    });

    if (error) {
      signupErr.textContent = error.message;
      signupErr.classList.add('visible');
      signupBtn.disabled = false;
      signupBtn.textContent = 'Create Account';
      return;
    }

    // Email confirmation is on — do not auto-redirect.
    //
    // The catch, and the reason people were "creating an account and never
    // getting the email": when the address already has an account, Supabase's
    // user-enumeration protection returns HTTP 200 with a REAL-LOOKING but fake
    // user — random id, confirmation_sent_at filled in — and an empty
    // `identities` array, and it sends no email at all. This page used to treat
    // that as success and say "check your email" to someone who would never
    // receive one. `identities: []` is the documented tell; it is the only thing
    // in the response that distinguishes a new signup from a silent no-op.
    const alreadyRegistered = Array.isArray(data?.user?.identities)
      && data.user.identities.length === 0;

    if (alreadyRegistered) {
      lastSignupEmail = email;
      signupExists.classList.add('visible');
      signupBtn.disabled = false;
      signupBtn.textContent = 'Create Account';
      return;
    }

    signupOk.classList.add('visible');
    signupBtn.textContent = 'Account created';
  });

  // ── Resend confirmation ────────────────────────────────────────────────────
  // For the case the message above describes: the account exists but was never
  // confirmed, so the operator needs another copy of the original email rather
  // than a new account. Supabase rate-limits this, and that error is worth
  // showing verbatim — "wait 60 seconds" is actionable, a silent no-op is not.
  resendBtn.addEventListener('click', async () => {
    if (!lastSignupEmail) return;
    resendBtn.disabled = true;
    resendBtn.textContent = 'Sending...';
    signupErr.classList.remove('visible');

    const { error: resendError } = await client.auth.resend({
      type: 'signup',
      email: lastSignupEmail,
      options: { emailRedirectTo: SIGNUP_REDIRECT },
    });

    if (resendError) {
      // Supabase returns this when the account is already confirmed. That is not
      // a failure the operator can act on by waiting — they should just sign in.
      signupErr.textContent = /already (been )?confirmed/i.test(resendError.message)
        ? 'That account is already confirmed — sign in with your password, or use "Forgot password".'
        : resendError.message;
      signupErr.classList.add('visible');
      resendBtn.disabled = false;
      resendBtn.textContent = 'Resend the confirmation email';
      return;
    }

    existsText.textContent = 'Confirmation email sent again to ' + lastSignupEmail + '. Check spam if it is not there in a minute.';
    resendBtn.style.display = 'none';
  });

  // ── Reset-password form ────────────────────────────────────────────────────
  const resetForm = document.getElementById('reset-form');
  const resetBtn  = document.getElementById('reset-btn');
  const resetErr  = document.getElementById('reset-error');
  const resetOk   = document.getElementById('reset-success');

  resetForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    resetBtn.disabled = true;
    resetBtn.textContent = 'Sending…';
    resetErr.classList.remove('visible');
    resetOk.classList.remove('visible');

    const email = document.getElementById('reset-email').value.trim();

    const { error } = await client.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + '/reset-password.html',
    });

    if (error) {
      resetErr.textContent = error.message;
      resetErr.classList.add('visible');
      resetBtn.disabled = false;
      resetBtn.textContent = 'Send Reset Link';
      return;
    }

    resetOk.classList.add('visible');
    // Leave button disabled — don't let them spam the send
  });
})();
</script>
</body>
</html>
